# Builds, signs, notarizes, and publishes MacControl.app when a version tag such as v0.3.0 is pushed.
# Repository secrets:
#   DEVELOPER_ID_P12_BASE64   base64 of the exported "Developer ID Application" certificate and private key
#   DEVELOPER_ID_P12_PASSWORD password of that .p12
#   NOTARY_KEY_P8_BASE64      base64 of the App Store Connect API key (AuthKey_<id>.p8)
#   NOTARY_KEY_ID             its key ID
#   NOTARY_ISSUER_ID          its issuer ID
# The tests in ci.yml run first; nothing is signed or published unless they pass.
# Without the secrets the tag is only checked, and the release is published from a Mac that holds the
# Developer ID key: sh scripts/build-app.sh --sign, sh scripts/notarize.sh, then gh release create.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  release:
    needs: test
    runs-on: macos-latest
    # Only this job holds the signing secrets and may publish.
    permissions:
      contents: write
    env:
      SIGNING: ${{ secrets.DEVELOPER_ID_P12_BASE64 != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Check that the tag matches the app version
        run: |
          version=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" App/Info.plist)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME does not match App/Info.plist version $version" >&2; exit 1; }

      - name: Note that the release is published locally
        if: env.SIGNING != 'true'
        run: echo "::notice::No signing secrets in this repository, so $GITHUB_REF_NAME is only checked here and is published from a Mac with the Developer ID key."

      - name: Import the signing certificate and notary key into a temporary keychain
        if: env.SIGNING == 'true'
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          P8: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
          KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(uuidgen)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          echo "$P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool store-credentials maccontrol --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$KEY_ID" \
            --issuer "$ISSUER_ID" --keychain "$keychain"
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/AuthKey.p8"
          echo "MACCONTROL_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Build and sign
        if: env.SIGNING == 'true'
        run: sh scripts/build-app.sh --sign

      - name: Notarize and staple
        if: env.SIGNING == 'true'
        run: MACCONTROL_NOTARY_KEYCHAIN="$MACCONTROL_KEYCHAIN" sh scripts/notarize.sh

      - name: Publish the release
        if: env.SIGNING == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dmg=$(ls .build/app/MacControl-*.dmg)
          # The checksum file names only the DMG, so shasum -c works next to the download.
          (cd "$(dirname "$dmg")" && shasum -a 256 "$(basename "$dmg")" | tee "$(basename "$dmg").sha256")
          gh release create "$GITHUB_REF_NAME" "$dmg" "$dmg.sha256" --title "MacControl ${GITHUB_REF_NAME#v}" --generate-notes

      - name: Remove the temporary keychain
        if: always() && env.SIGNING == 'true'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
