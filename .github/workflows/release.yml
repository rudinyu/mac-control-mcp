# Builds, signs, notarizes, and publishes MacControl.app when a version tag such as v0.3.0 is pushed.
# Repository secrets:
#   DEVELOPER_ID_P12_BASE64   base64 of the exported "Developer ID Application" certificate and private key
#   DEVELOPER_ID_P12_PASSWORD password of that .p12
#   NOTARY_KEY_P8_BASE64      base64 of the App Store Connect API key (AuthKey_<id>.p8)
#   NOTARY_KEY_ID             its key ID
#   NOTARY_ISSUER_ID          its issuer ID
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches the app version
        run: |
          version=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" App/Info.plist)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME does not match App/Info.plist version $version" >&2; exit 1; }

      - name: Test
        run: sh scripts/ci.sh

      - name: Import the signing certificate and notary key into a temporary keychain
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          P8: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
          KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(uuidgen)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          echo "$P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool store-credentials maccontrol --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$KEY_ID" \
            --issuer "$ISSUER_ID" --keychain "$keychain"
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/AuthKey.p8"
          echo "MACCONTROL_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Build and sign
        run: sh scripts/build-app.sh --sign

      - name: Notarize and staple
        run: |
          dmg=$(ls .build/app/MacControl-*.dmg)
          MACCONTROL_NOTARY_KEYCHAIN="$MACCONTROL_KEYCHAIN" sh scripts/notarize.sh "$dmg"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dmg=$(ls .build/app/MacControl-*.dmg)
          shasum -a 256 "$dmg" | tee "$dmg.sha256"
          gh release create "$GITHUB_REF_NAME" "$dmg" "$dmg.sha256" --title "MacControl ${GITHUB_REF_NAME#v}" --generate-notes

      - name: Remove the temporary keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
